[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "dotman"
dynamic = ["version"]
description = "Dry-run planner for the package-oriented dotman engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "tqdm>=4.67.0",
  "Jinja2>=3.1.4",
  "pathspec>=1.0.4",
  "prompt-toolkit>=3.0.52",
  "tomlkit>=0.15.1",
  "pyyaml>=6.0.3",
  "textual>=8.2.8",
  "lxml>=6.1.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
dotman = "dotman.cli:console_main"

# Release tags are the only version source, so a release cannot ship a stale number.
[tool.hatch.version]
source = "vcs"
# Source archives have no git history; build them as an unknown version instead of failing.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/dotman"]

# The version comes from git, so a new commit or tag must rebuild the installed package.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
