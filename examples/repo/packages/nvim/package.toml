description = "Neovim configuration with a rendered target and an interactive editor step"

[vars.nvim]
leader = ","
colorscheme = "habamax"

[targets.init_lua]
source = "files/config/nvim/init.lua.tmpl"
path = "~/.config/nvim/init.lua"
render = "sh hooks/render.sh"
compare = { repo = "render", live = "raw" }
editor = { run = "sh hooks/reconcile.sh", io = "tty" }

[hooks]
guard_pull = '''
command -v nvim >/dev/null 2>&1
'''
